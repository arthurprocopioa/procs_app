name: procs_ai
description: Procs AI - Premium Health & Gamification.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ---
  # FUNDAÇÃO V3.4 (Pós-Pivot)
  # ---

  # 1. Gerenciamento de Estado
  provider: ^6.1.2

  # 2. Backend (Firebase)
  firebase_core: ^3.1.1
  firebase_auth: ^5.1.1
  cloud_firestore: ^5.0.2
  firebase_messaging: ^15.0.2
  firebase_analytics: ^11.1.0

  # 3. Monetização
  purchases_flutter: ^9.9.7 # (RevenueCat V3)

  # 4. UI/UX (V3.1)
  google_fonts: ^6.2.1
  font_awesome_flutter: ^10.7.0
  lottie: ^3.1.2
  
  cupertino_icons: ^1.0.2

  # 5. Auth Social V3
  google_sign_in: ^6.2.1 
  sign_in_with_apple: ^6.1.0
  flutter_localizations:
    sdk: flutter
  flutter_animate: ^4.5.2
  confetti: ^0.8.0
  flutter_markdown: ^0.7.7+1
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  image_picker: ^1.2.1
  permission_handler: ^12.0.1
  camera: ^0.11.3
  google_mlkit_pose_detection: ^0.14.0
  google_mlkit_commons: ^0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  
  # --- NOVAS DEPENDÊNCIAS PARA ÍCONES E SPLASH ---
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/hero_image.png
    # Certifique-se de colocar seus ícones aqui quando criá-los:
    - assets/images/background_premium.png
    - assets/images/splash_logo.png
    - assets/images/focus_areas/
    - assets/images/physiques/

# --- CONFIGURAÇÃO DOS ÍCONES ---
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/app_icon.png" # Você precisará criar este arquivo (1024x1024)
  min_sdk_android: 21 # Otimização
  adaptive_icon_background: "#000000" # Fundo preto para Android Adaptativo
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png" # O logo sem fundo (opcional, mas recomendado)

# --- CONFIGURAÇÃO DA TELA DE CARREGAMENTO (SPLASH) ---
flutter_native_splash:
  color: "#000000" # Fundo PRETO IMERSIVO
  image: "assets/images/splash_logo.png" # Seu logo centralizado (PNG transparente)
  android_12:
    image: "assets/images/splash_logo.png"
    color: "#000000"
  web: false # Web tem sua própria lógica no index.html